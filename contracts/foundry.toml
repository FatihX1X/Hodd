[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 500
depth = 100
fail_on_revert = false

[lint]
# The tests are allowed to cast, warp and so on. The two timestamp comparisons in src are
# intentional (UTC-day budget and signature deadline) and carry an inline `forge-lint` comment.
exclude_lints = ["unsafe-typecast"]
ignore = ["test/**", "script/**"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
